[project]
name = "dlss5_nodes"
version = "0.1.0"
description = "Griptape Nodes library for NVIDIA DLSS 5 Neural Rendering on video (via the DLSS5-for-Nuke worker)"
authors = [
    {name = "Griptape Community", email = "community@griptape.ai"}
]
readme = "README.md"
requires-python = "~=3.12"
dependencies = [
    "griptape-nodes",
    "imageio[ffmpeg]>=2.37.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
]

[tool.uv.sources]
griptape-nodes = { git = "https://github.com/griptape-ai/griptape-nodes", rev="latest" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
